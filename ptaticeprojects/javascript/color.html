<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Document</title>
    <style>
        img {
            transition: all 0.5s;
        }
    </style>

</head>
<body>
    <div class="container text-center p-5">
        <div class="btn btn-dark">changecolor</div>
    </div>

    <script>
        let btn = document.querySelector('.btn');
        let body = document.body;
        let color = ['red', 'green', 'yellow', 'blue', 'black'];
        // let count = 0;


        const randomnumber =()=>{


            const random=Math.random()*color.length;
            const floornum=Math.floor(random);
            return floornum;
        }


        btn.addEventListener('click', () => {
            // console.log(randomnumber());

            body.style.background = `linear-gradient(to right, ${color[randomnumber()]}, ${color[randomnumber()] })`;
            
            
        });
    </script>
    
</body>
</html>
