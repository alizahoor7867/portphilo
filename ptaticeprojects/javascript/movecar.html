<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Document</title>
    <style>
        .car{
            transition: all 0.4s;
            width: 200px;
            height: 200px;

        }

      
    </style>

</head>
<body>
    <img src="https://hyundai-nishat.com/wp-content/uploads/2023/11/Elantra-Side-Transparent.webp" alt=""
    class="car" >
    
    
    <script>

       let car = document.querySelector('.car');
       let distance =0;
       let distancey=0;
// console.log(car);
window.addEventListener('keydown', (e) => {
    document.body.style.backgroundColor = 'red';

    // console.log(e.key);
    if (e.key == 'ArrowRight' && distance < window.innerWidth - 100) {

if (distance >= window.innerWidth - 120) {
    distance = 0;  // Reset to the initial position
    car.style.transform = `translate(${distance}px,${distancey}px)`;

} else {
    distance += 10;  // Move the car 10px to the right
    car.style.transform = `translate(${distance}px,${distancey}px)`;

}
if(e.shiftKey ){
    distance +=80;
    car.style.transform = `translate(${distance}px,${distancey}px)`;


    if (distance >= window.innerWidth - 120) {
    distance = 0;  // Reset to the initial position
    car.style.transform = `translate(${distance}px,${distancey}px)`;

}





}

}

    else if(e.key == 'ArrowLeft' && distance>0){
        // distance =0;
        distance -=10;

        car.style.transform = `translate(${distance}px,${distancey}px)rotate(-180deg)`;


    }
    else if(e.key =='ArrowDown'){
        distancey +=10;
        car.style.transform = `translate(${distance}px,${distancey}px) rotate(90deg)`;

        

        
    }
    else if(e.key =='ArrowUp'){
        distancey -=10;
        car.style.transform = `translate(${distance}px,${distancey}px) rotate(-90deg)`;

        

    }

});

    </script>
    
    
</body>
</html>
