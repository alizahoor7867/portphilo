<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Document</title>
    <style>
        img {
            transition: all 0.5s;
        }
    </style>

</head>
<body>
    <h1 class=" text-center display-1"></h1>

    <div class="container text-center p-5">
        <div class="row"></div>
    </div>



    <script>
     
        let api='https://api.github.com/users';
        let row=document.querySelector('.row');
        const fetchdata=async() =>{
            const response=await fetch(api);
            const data= await response.json();
            console.log(data);
            return data;


        }
         console.log(fetchdata());


        const displaydata = async () => {
    const data = await fetchdata();
    
    data?.forEach((item, index) => {
        let column = document.createElement('div');
        row.appendChild(column); 
        
        column.classList.add('col-lg-3','col-md-4',); 
        let card=document.createElement('div');
        column.appendChild(card);
        card.classList.add('card','p-4','border-0','shadow-lg','my-3','text-center');
       
        let image = document.createElement('img');  
        image.src = item?.avatar_url;
        image.classList.add('w-100');
        card.appendChild(image);
        let para=document.createElement('h4');
        card.appendChild(para);
        para.innerHTML=item.login;
        


        





        
    });
};

displaydata();



setInterval(() => {
    let data = new Date(); 
    let hours = data.getHours();
    let min = data.getMinutes();
    let sec = data.getSeconds();
    document.querySelector('h1').innerHTML = `${hours}:${min}:${sec}`;
}, 1000);










    

        

    
    </script>
    
</body>
</html>
