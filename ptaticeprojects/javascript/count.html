<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    
    <div class="container text-center ">
        <h1 class="heading display-1"> 0</h1>

        <button class="btn btn-success">revese</button>
        <button class="btn btn-outline-warning">reset</button>
        <button class="btn btn-danger">increse</button>

    </div>
    <script>
        let heading =document.querySelector('.heading');
        let btns=document.querySelectorAll('.btn');
        let count=0;
        let tick=new Audio('./horn.wav');
        btns.forEach((item,index)=>{
            item.addEventListener('click',()=>{
                if(index==2){
                    count++;
                    heading.innerHTML=count;
                    heading.style.color='green';
                    tick.play();



                }
                else if(index==0){
                    count--;
                    heading.innerHTML=count;

                    heading.style.color='blue';


                //     if(count<0){

                //     count=0;

                //     tick.play();


                    
                // }
                // heading.innerHTML=count;
                }
                else
                {
                    tick.play();

                    count=0;

                    heading.innerHTML=count;
                    heading.style.color='yellow';

                }

                // console.log(item.classList.contains("btn-danger"));
            })


        })
        

    </script>
    
</body>
</html>
