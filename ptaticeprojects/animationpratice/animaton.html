<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #eee;
        }
        .div{
            width: 300px;
            height: 300px;
            position: absolute;
            top: 50%;
            left: 50%;
            line-height: 300px;
            margin: -150px;
            background: rgb(255, 25, 25);
            color: #0344;
            text-align: center;
            font-size: 40px;
            box-shadow:  0 0 15px rgba(0,0,0,0,1);
            animation-name: animation;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
            animation-timing-function: ease-in-out;
            animation-play-state: paused
           
            
        
        
        }
        .div:hover{
            color: blue;
            background-color: greenyellow;
            animation-play-state: running;
        }
        
        @keyframes animation {
    from {
        transform: rotate(0deg);
        border-radius: 0%; background-color: yellow color(srgb red green blue); /* Start with square corners */
    }
    to {
        transform: rotate(360deg);
        border-radius: 50%; /* End with circular corners */
    }
}

.element {
    animation: animation 2s infinite; /* Adjust duration and infinite loop as needed */
}

      
    
    </style>
</head>
<body>

    <div class="div"><p>heellow </p></div>
    
</body>
</html>
